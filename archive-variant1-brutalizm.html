<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Первый экран — вариант 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite-950:#0a0a0a;
    --graphite-900:#131311;
    --graphite-line:#2a2a26;
    --fuchsia:#ff1f8f;
    --bone:#ede9e2;
    --grey:#87867f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--graphite-950);}
  html{overflow-x:hidden;}
  body{
    font-family:'Space Mono', monospace;
    color:var(--bone);
    -webkit-font-smoothing:antialiased;
  }
  .hero{
    min-height:100vh;
    min-height:100dvh;
    background:var(--graphite-950);
    display:flex;
    flex-direction:column;
    padding:0 8vw;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:0.5rem 1rem;
    min-width:0;
    padding:2.6rem 0 0 0;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--grey);
    border-bottom:1px solid var(--graphite-line);
    padding-bottom:1.6rem;
  }
  .topbar .mark{color:var(--bone);letter-spacing:0.18em;}
  .body-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    max-width:1000px;
    min-width:0;
    padding:6vh 0;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--grey);
    margin-bottom:2rem;
  }
  .eyebrow b{color:var(--bone); font-weight:700;}
  h1{
    font-family:'Big Shoulders Display', sans-serif;
    font-weight:800;
    text-transform:uppercase;
    font-size:clamp(1.4rem, 6.6vw, 4.9rem);
    line-height:1.02;
    letter-spacing:-0.005em;
    color:var(--bone);
    min-width:0;
  }
  h1 .line{
    display:block;
    overflow:hidden;
    white-space:nowrap;
    min-width:0;
  }
  h1 .line span{
    display:inline-block;
    transform:translateY(105%);
    animation:slideUp .7s cubic-bezier(.2,.7,.2,1) forwards;
  }
  h1 .line:nth-child(1) span{animation-delay:.1s;}
  h1 .line:nth-child(2) span{animation-delay:.2s;}
  h1 .line:nth-child(3) span{animation-delay:.3s;}
  h1 .line:nth-child(4) span{animation-delay:.4s;}
  h1 .hide{
    position:relative;
    display:inline-block;
  }
  h1 .hide .ghost{
    position:absolute;
    left:-0.22em;
    top:-0.16em;
    color:var(--bone);
    z-index:0;
    white-space:nowrap;
    user-select:none;
  }
  h1 mark{
    position:relative;
    z-index:1;
    display:inline-block;
    background:var(--fuchsia);
    color:var(--graphite-950);
    padding:0.22em 0.55em;
    box-decoration-break:clone;
    -webkit-box-decoration-break:clone;
  }
  .sub{
    margin-top:2.2rem;
    font-family:'Space Mono', monospace;
    font-size:14px;
    line-height:1.8;
    color:var(--grey);
    max-width:44ch;
    padding-left:1.1rem;
    border-left:2px solid var(--fuchsia);
    opacity:0;
    animation:rise .6s ease forwards .8s;
  }
  .cta-row{
    margin-top:2.8rem;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    min-width:0;
    gap:1.4rem;
    opacity:0;
    animation:rise .6s ease forwards 1s;
  }
  .cta{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:transparent;
    color:var(--bone);
    border:1px solid var(--bone);
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:1rem 1.9rem;
    text-decoration:none;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .cta:hover{background:var(--fuchsia); color:var(--graphite-950); border-color:var(--fuchsia);}
  .cta-note{
    font-size:12px;
    color:var(--grey);
  }
  .footline{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:0.5rem 1rem;
    min-width:0;
    padding:1.4rem 0 2.6rem 0;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    border-top:1px solid var(--graphite-line);
    color:var(--grey);
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes slideUp{
    from{transform:translateY(105%);}
    to{transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    h1 .line span{animation:none; transform:none;}
    .sub, .cta-row{animation:none; opacity:1; transform:none;}
  }
  @media (max-width:640px){
    .hero{padding:0 6vw;}
    h1{max-width:100%;}
  }
  .hero{position:relative;}
  .hero-media{
    position:absolute;
    top:0; right:0; bottom:0;
    width:46vw;
    max-width:680px;
    overflow:hidden;
    z-index:0;
  }
  .hero-media img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:60% 30%;
    display:block;
  }
  .hero-media::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(90deg, var(--graphite-950) 0%, rgba(10,10,10,0.88) 14%, rgba(10,10,10,0.3) 42%, rgba(10,10,10,0) 68%);
  }
  .hero-media::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(0deg, var(--graphite-950) 0%, rgba(10,10,10,0) 22%, rgba(10,10,10,0) 78%, var(--graphite-950) 100%);
  }
  .topbar, .body-wrap, .footline{position:relative; z-index:1;}
  @media (max-width:900px){
    .hero-media{
      width:100%;
      max-width:none;
      left:0;
      top:0;
      bottom:0;
    }
    .hero-media img{
      object-position:62% 22%;
      opacity:0.5;
    }
    .hero-media::before{
      background:linear-gradient(0deg, var(--graphite-950) 0%, rgba(10,10,10,0.55) 30%, rgba(10,10,10,0.55) 65%, var(--graphite-950) 100%);
    }
    .hero-media::after{display:none;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-media"><img src="assets/hero.jpg" alt="" loading="eager"></div>
  <div class="topbar">
    <div class="mark">И. ФАМИЛИЯ</div>
    <div>Москва / Онлайн</div>
  </div>

  <div class="body-wrap">
    <div class="eyebrow">Провокативная терапия <b>·</b> только для мужчин</div>
    <h1>
      <span class="line"><span>Ты не разбираешься</span></span>
      <span class="line"><span>в себе — ты</span></span>
      <span class="line"><span class="hide"><span class="ghost" aria-hidden="true">прячешься</span><mark>прячешься</mark></span></span>
      <span class="line"><span>от себя</span></span>
    </h1>
    <p class="sub">Один разговор — без анестезии. Дальше прятаться будет некуда.</p>
    <div class="cta-row">
      <a href="#" class="cta">Написать →</a>
      <span class="cta-note">Без права спрятаться повторно.</span>
    </div>
  </div>

  <div class="footline">
    <div>Провокативная терапия</div>
    <div>Скролл вниз</div>
  </div>
</div>

</body>
</html>
